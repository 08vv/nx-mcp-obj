[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nx-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "trimesh",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nx-mcp = "nx_mcp.server:main"
nx-mcp-http = "nx_mcp.http_server:main"
nx-mcp-nx = "nx_mcp.cli_validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nx_mcp = [
    "**/*.py",
    "**/*.md",
    "**/*.prt",
    "**/*.txt"
]

